<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirm your new Paper scroll studio address</title>
</head>
<body style="margin:0;padding:0;background:#1a0a04;font-family:Georgia,'Times New Roman',serif;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#1a0a04;">
    <tr>
      <td align="center" style="padding:36px 16px;">
        <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:540px;background:#fdf8ee;border-radius:14px;overflow:hidden;">
          <tr>
            <td style="background:#6e2f2a;padding:12px 28px;text-align:center;">
              <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(253,244,227,0.78);">Paper scroll studio</p>
            </td>
          </tr>
          <tr>
            <td style="background:#582420;padding:28px 32px 24px;text-align:center;">
              <div style="display:inline-block;width:56px;height:56px;background:#a84040;border-radius:50%;margin-bottom:14px;line-height:56px;font-size:24px;color:#fdf4e3;">✦</div>
              <h1 style="margin:0 0 10px;color:#fdf4e3;font-family:Georgia,serif;font-size:24px;font-weight:400;">Confirm this address</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 32px 20px;">
              <p style="margin:0 0 24px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.65;color:#4a3728;">
                You asked Paper scroll studio to use this address. Tap the wax seal to confirm. This is not a bank notice or a password reset from another company.
              </p>
              <table cellpadding="0" cellspacing="0" role="presentation" align="center" style="margin:8px auto 28px;">
                <tr>
                  <td align="center" style="background:#6e2f2a;border-radius:999px;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:16px 40px;color:#fdf4e3;font-family:Arial,Helvetica,sans-serif;font-size:14px;letter-spacing:0.14em;text-transform:uppercase;text-decoration:none;font-weight:700;">Confirm email</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="background:#f0e6d0;padding:18px 28px;text-align:center;">
              <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#8a6850;">Sent by <strong>Paper scroll studio</strong></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
